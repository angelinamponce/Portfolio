<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found · Angelina Ponce</title>
<link rel="icon" type="image/svg+xml" href="/Assets/favicon.svg">
<script>
  /* follow the site's saved theme (set on the main page) */
  try { if (localStorage.getItem('apTheme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
</script>
<style>
  :root {
    --forest: #0e1f16; --sage: #4e8060; --sage-text: #3d6b4f; --sage-light: #8cbd9e;
    --gold: #b49660; --cream: #faf7f0; --ink: #1b2a21; --muted: #5a6b60;
    --bg: var(--cream); --heading: var(--forest); --text: var(--muted); --link: var(--sage-text);
  }
  [data-theme="dark"] { --bg: #0c1611; --heading: var(--cream); --text: rgba(227,236,230,0.7); --link: var(--sage-light); }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: grid; place-items: center; padding: 32px 16px;
    background: var(--bg); color: var(--text);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 520px; text-align: center; }
  .code { font: 500 12px/1 ui-monospace, "SFMono-Regular", Menlo, monospace; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); }
  h1 { margin: 14px 0 12px; font: 600 clamp(36px, 8vw, 56px)/1.05 "Cormorant Garamond", Georgia, "Times New Roman", serif; color: var(--heading); }
  h1 em { font-style: italic; color: var(--sage); }
  [data-theme="dark"] h1 em { color: var(--sage-light); }
  .rule { width: 56px; height: 2px; margin: 0 auto 20px; background: linear-gradient(90deg, var(--gold), var(--sage)); }
  p { margin: 0 0 28px; }
  a.home {
    display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 10px 22px;
    border: 1px solid currentColor; border-radius: 100px; color: var(--link); text-decoration: none;
    font-weight: 600; font-size: 13px; letter-spacing: 1px; text-transform: uppercase;
  }
  a.home:hover { background: var(--forest); border-color: var(--forest); color: var(--cream); }
  a.home:focus-visible { outline: 2px solid var(--sage); outline-offset: 3px; }
</style>
</head>
<body>
  <main>
    <div class="code">Error 404</div>
    <h1>This page <em>isn't here</em></h1>
    <div class="rule"></div>
    <p>The link may be old or mistyped.</p>
    <a class="home" href="/">← Back home</a>
  </main>
</body>
</html>
